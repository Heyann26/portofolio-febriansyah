<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#0b0c13;font-family:'Plus Jakarta Sans',Inter,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="mpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#07080d"/>
    </linearGradient>
    <linearGradient id="mpCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161826"/>
      <stop offset="100%" stop-color="#10121d"/>
    </linearGradient>
    <linearGradient id="neonRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2d55"/>
      <stop offset="100%" stop-color="#ff758c"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#mpBg)"/>

  <!-- Top Navigation Header -->
  <rect x="0" y="0" width="1200" height="70" fill="#0d0f18" stroke="#1f2334" stroke-width="1"/>
  <circle cx="50" cy="35" r="15" fill="url(#neonRed)"/>
  <text x="50" y="41" fill="#fff" font-weight="900" font-size="16" text-anchor="middle">M</text>
  <text x="78" y="41" fill="#fff" font-weight="800" font-size="19">Market<tspan fill="#ff2d55">Pulse</tspan></text>
  <text x="210" y="41" fill="#6d738f" font-size="12">| Analisis Strategi Pemasaran &amp; Omnichannel</text>

  <!-- Live Status Badge -->
  <rect x="910" y="20" width="140" height="30" rx="15" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <circle cx="925" cy="35" r="4" fill="#10b981"/>
  <text x="938" y="40" fill="#10b981" font-size="11" font-weight="700">Real-time Sync</text>

  <rect x="1065" y="18" width="105" height="34" rx="8" fill="url(#neonRed)"/>
  <text x="1117" y="40" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Export Data</text>

  <!-- KPI Cards Row -->
  <!-- KPI 1 -->
  <rect x="40" y="95" width="265" height="110" rx="14" fill="url(#mpCard)" stroke="#22273d" stroke-width="1"/>
  <text x="65" y="126" fill="#8d93ad" font-size="12" font-weight="600">Total Penjualan Omnichannel</text>
  <text x="65" y="163" fill="#fff" font-size="26" font-weight="800">Rp 1,42 Milyar</text>
  <text x="65" y="188" fill="#10b981" font-size="11" font-weight="700">▲ +24.8% vs Kuartal Lalu</text>

  <!-- KPI 2 -->
  <rect x="330" y="95" width="265" height="110" rx="14" fill="url(#mpCard)" stroke="#22273d" stroke-width="1"/>
  <text x="355" y="126" fill="#8d93ad" font-size="12" font-weight="600">Biaya Akuisisi Konsumen (CAC)</text>
  <text x="355" y="163" fill="#ff2d55" font-size="26" font-weight="800">Rp 48.500</text>
  <text x="355" y="188" fill="#10b981" font-size="11" font-weight="700">▼ -12.3% Lebih Hemat</text>

  <!-- KPI 3 -->
  <rect x="620" y="95" width="265" height="110" rx="14" fill="url(#mpCard)" stroke="#22273d" stroke-width="1"/>
  <text x="645" y="126" fill="#8d93ad" font-size="12" font-weight="600">Return on Ad Spend (ROAS)</text>
  <text x="645" y="163" fill="#fff" font-size="26" font-weight="800">5.82x</text>
  <text x="645" y="188" fill="#10b981" font-size="11" font-weight="700">▲ +1.1x Di Atas Target</text>

  <!-- KPI 4 -->
  <rect x="910" y="95" width="250" height="110" rx="14" fill="url(#mpCard)" stroke="#22273d" stroke-width="1"/>
  <text x="935" y="126" fill="#8d93ad" font-size="12" font-weight="600">Tingkat Retensi Pelanggan</text>
  <text x="935" y="163" fill="#a855f7" font-size="26" font-weight="800">76.4%</text>
  <text x="935" y="188" fill="#a855f7" font-size="11" font-weight="700">Loyalitas Pelanggan Tinggi</text>

  <!-- Left Main Visual: Channel Conversion Breakdown -->
  <rect x="40" y="230" width="700" height="415" rx="16" fill="url(#mpCard)" stroke="#22273d" stroke-width="1"/>
  <text x="70" y="268" fill="#fff" font-size="16" font-weight="700">Performa Saluran Pemasaran Digital (Conversion &amp; Sales)</text>
  <text x="70" y="288" fill="#787e9d" font-size="12">TikTok Ads • Instagram Shopping • Marketplace Shopee &amp; Tokopedia</text>

  <!-- Bar Charts -->
  <!-- TikTok -->
  <text x="70" y="340" fill="#cbd1e8" font-size="13" font-weight="600">TikTok Video &amp; Live Shopping (@Heyann26)</text>
  <text x="710" y="340" fill="#ff2d55" font-size="13" font-weight="800" text-anchor="end">Rp 640 Jt (45%)</text>
  <rect x="70" y="350" width="640" height="16" rx="8" fill="#191c2c"/>
  <rect x="70" y="350" width="480" height="16" rx="8" fill="url(#neonRed)"/>

  <!-- Instagram -->
  <text x="70" y="405" fill="#cbd1e8" font-size="13" font-weight="600">Instagram Feeds &amp; Reels Engagement</text>
  <text x="710" y="405" fill="#a855f7" font-size="13" font-weight="800" text-anchor="end">Rp 420 Jt (30%)</text>
  <rect x="70" y="415" width="640" height="16" rx="8" fill="#191c2c"/>
  <rect x="70" y="415" width="340" height="16" rx="8" fill="url(#purpleGrad)"/>

  <!-- Marketplace Shopee/Tokopedia -->
  <text x="70" y="470" fill="#cbd1e8" font-size="13" font-weight="600">Marketplace E-Commerce Direct</text>
  <text x="710" y="470" fill="#3b82f6" font-size="13" font-weight="800" text-anchor="end">Rp 250 Jt (18%)</text>
  <rect x="70" y="480" width="640" height="16" rx="8" fill="#191c2c"/>
  <rect x="70" y="480" width="220" height="16" rx="8" fill="#3b82f6"/>

  <!-- Organic Website -->
  <text x="70" y="535" fill="#cbd1e8" font-size="13" font-weight="600">Direct Brand Website &amp; Referral</text>
  <text x="710" y="535" fill="#10b981" font-size="13" font-weight="800" text-anchor="end">Rp 110 Jt (7%)</text>
  <rect x="70" y="545" width="640" height="16" rx="8" fill="#191c2c"/>
  <rect x="70" y="545" width="90" height="16" rx="8" fill="#10b981"/>

  <rect x="70" y="590" width="640" height="38" rx="8" fill="#141724" stroke="#23273c" stroke-width="1"/>
  <text x="85" y="614" fill="#a8aebd" font-size="11">💡 <tspan fill="#fff" font-weight="700">Analisis Manajerial:</tspan> Konten video vertikal di TikTok memiliki ROAS tertinggi (6.4x), disarankan meningkatkan alokasi budget 15% pada Q4.</text>

  <!-- Right Card: Consumer Demographics & Segment -->
  <rect x="765" y="230" width="395" height="415" rx="16" fill="url(#mpCard)" stroke="#22273d" stroke-width="1"/>
  <text x="795" y="268" fill="#fff" font-size="16" font-weight="700">Segmentasi Pasar Konsumen</text>
  <text x="795" y="288" fill="#787e9d" font-size="12">Target Audiens Generasi Z &amp; Millennial</text>

  <!-- Demographic Bars -->
  <rect x="795" y="320" width="335" height="65" rx="10" fill="#131522" stroke="#222638" stroke-width="1"/>
  <text x="815" y="345" fill="#fff" font-size="13" font-weight="700">Usia 18 - 24 Tahun (Mahasiswa &amp; Gen Z)</text>
  <text x="815" y="365" fill="#8d93ad" font-size="11">Pangsa Pasar: 54% • Preferensi: Trend-setter &amp; Mobile First</text>

  <rect x="795" y="400" width="335" height="65" rx="10" fill="#131522" stroke="#222638" stroke-width="1"/>
  <text x="815" y="425" fill="#fff" font-size="13" font-weight="700">Usia 25 - 34 Tahun (Early Career)</text>
  <text x="815" y="445" fill="#8d93ad" font-size="11">Pangsa Pasar: 36% • Preferensi: Kualitas &amp; Efisiensi</text>

  <!-- Customer Feedback Score -->
  <rect x="795" y="480" width="335" height="145" rx="10" fill="#131522" stroke="#222638" stroke-width="1"/>
  <text x="815" y="508" fill="#fff" font-size="13" font-weight="700">Net Promoter Score (NPS)</text>
  <text x="815" y="548" fill="#ff2d55" font-size="36" font-weight="900">+72</text>
  <text x="890" y="538" fill="#fff" font-size="13" font-weight="700">Kategori: Excellent</text>
  <text x="890" y="555" fill="#8d93ad" font-size="11">Berdasarkan 1.250 ulasan terverifikasi</text>
  <line x1="815" y1="575" x2="1110" y2="575" stroke="#23273c"/>
  <text x="815" y="605" fill="#10b981" font-size="12" font-weight="600">✔ Kepuasan layanan pelanggan di atas 94%</text>

</svg>
