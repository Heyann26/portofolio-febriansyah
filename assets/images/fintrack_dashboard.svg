  <text x="28" y="348" fill="#585c75" font-size="11" font-weight="700" letter-spacing="1.5">STRATEGI BISNIS</text>
  <text x="44" y="378" fill="#8d92ab" font-size="13" font-weight="500">Forecast 2026/2027</text>
