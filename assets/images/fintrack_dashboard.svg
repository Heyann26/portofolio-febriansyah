  <rect x="924" y="495" width="225" height="42" rx="8" fill="#141724" stroke="#222638" stroke-width="1"/>
  <circle cx="940" cy="516" r="4" fill="#10b981"/>
  <text x="955" y="512" fill="#fff" font-size="11" font-weight="600">Verifikasi Faktur Penjualan</text>
